name: zizmor

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .
          # Pin zizmor itself so new audits land through a reviewed bump, not a surprise CI failure.
          version: 1.30.1
          online-audits: true
          config: .github/zizmor.yml
          advanced-security: false
          annotations: true
        env:
          GH_TOKEN: ${{ github.token }}
