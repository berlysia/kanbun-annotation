name: Deploy Playground to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build packages
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test:run

      - name: Build playground
        id: playground
        run: pnpm playground:build

      # 古事記の本文は版を固定していて不変なので、取得した本文を cache に載せる。key は版と sha256 の
      # 定数だけを持つファイルの hash (組み立てのコードの編集では変わらない)。cache があれば取得しない。
      # cache から戻った本文は、build:kojiki が sha256 で照合し、違えば取り直す。
      - name: Restore Kojiki source cache
        id: kojiki-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/kojiki/.cache
          key: kojiki-source-v1-${{ hashFiles('packages/kojiki/src/source-pin.ts') }}

      - name: Build Kojiki page
        id: kojiki-page
        timeout-minutes: 5
        run: pnpm --filter @kanbun-skam/playground build:kojiki

      # 上の段が成功した (sha256 の照合を通った本文がある) ときだけ走る。後ろの段が失敗しても保存される
      - name: Save Kojiki source cache
        id: kojiki-cache-save
        if: steps.kojiki-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/kojiki/.cache
          key: kojiki-source-v1-${{ hashFiles('packages/kojiki/src/source-pin.ts') }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./packages/playground/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
